<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="50" height="50">
  <!-- Glowing circular brain/agent backdrop -->
  <circle cx="32" cy="32" r="30" fill="#f0f7ff"/>
  <!-- Central Agent Head -->
  <rect x="14" y="20" width="36" height="28" rx="8" fill="#1e293b" />
  <!-- Visor / Face Screen -->
  <rect x="19" y="25" width="26" height="13" rx="4" fill="#38bdf8" />
  <!-- Agent Eyes -->
  <circle cx="26" cy="31" r="3" fill="#0f172a" />
  <circle cx="38" cy="31" r="3" fill="#0f172a" />
  <!-- Center Neural Spark / Antenna -->
  <line x1="32" y1="20" x2="32" y2="12" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
  <circle cx="32" cy="10" r="4" fill="#38bdf8" />
  <!-- Side Nodes / Ears -->
  <rect x="10" y="29" width="4" height="10" rx="2" fill="#1e293b" />
  <rect x="50" y="29" width="4" height="10" rx="2" fill="#1e293b" />
  <!-- Interface status light bar -->
  <line x1="24" y1="42" x2="40" y2="42" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
</svg>